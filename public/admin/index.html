<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MvDK Community — Admin</title>
<style>
  /* ---- Fluent 2 design tokens (dark default, light via media query) ---- */
  :root {
    --brand:#479EF5; --brand-hover:#62abf5; --brand-pressed:#2886de; --on-brand:#0a1a2b;
    --bg:#1b1a19; --bg-2:#201f1e; --card:#292827; --card-hover:#2f2e2d; --card-2:#323130;
    --stroke:#3b3a39; --stroke-2:#4a4948;
    --text:#ffffff; --text-2:#d6d6d6; --text-3:#9d9d9d; --text-disabled:#6b6b6b;
    --danger:#dc626d; --danger-bg:#3b1e21; --danger-text:#eeacb2;
    --ok:#6ccb5f; --warn:#fce100;
    --shadow-2:0 1px 2px rgba(0,0,0,.24), 0 0 2px rgba(0,0,0,.12);
    --shadow-8:0 4px 8px rgba(0,0,0,.28), 0 0 2px rgba(0,0,0,.12);
    --shadow-16:0 8px 16px rgba(0,0,0,.28), 0 0 2px rgba(0,0,0,.12);
    --shadow-64:0 32px 64px rgba(0,0,0,.4), 0 0 8px rgba(0,0,0,.2);
    --r-s:4px; --r-m:8px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --brand:#0F6CBD; --brand-hover:#115EA3; --brand-pressed:#0C3B5E; --on-brand:#ffffff;
      --bg:#faf9f8; --bg-2:#f3f2f1; --card:#ffffff; --card-hover:#f5f5f5; --card-2:#fafafa;
      --stroke:#e1dfdd; --stroke-2:#c8c6c4;
      --text:#242424; --text-2:#424242; --text-3:#616161; --text-disabled:#bdbdbd;
      --danger:#c50f1f; --danger-bg:#fdf3f4; --danger-text:#b10e1c;
      --shadow-2:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
      --shadow-8:0 4px 8px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
      --shadow-16:0 8px 16px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
      --shadow-64:0 32px 64px rgba(0,0,0,.24), 0 0 8px rgba(0,0,0,.1);
    }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
         font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif; }
  .ico { width:16px; height:16px; flex:0 0 auto; vertical-align:-2px; }

  /* ---- buttons (Fluent) ---- */
  button { font:inherit; color:inherit; cursor:pointer; background:none; border:none; }
  .btn { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px;
         border-radius:var(--r-s); border:1px solid var(--stroke-2); background:var(--card);
         font-weight:600; font-size:13px; transition:background .08s, border-color .08s; white-space:nowrap; }
  .btn:hover { background:var(--card-hover); }
  .btn:active { background:var(--card-2); }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  .btn.primary:hover { background:var(--brand-hover); border-color:var(--brand-hover); }
  .btn.primary:active { background:var(--brand-pressed); }
  .btn.danger { background:transparent; border-color:var(--stroke-2); color:var(--danger); }
  .btn.danger:hover { background:var(--danger-bg); border-color:var(--danger); }
  .btn.subtle { border-color:transparent; background:transparent; color:var(--text-2); }
  .btn.subtle:hover { background:var(--card-hover); color:var(--text); }
  .btn.on { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  .btn.sm { height:28px; padding:0 8px; font-size:12px; }
  .iconbtn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px;
             border-radius:var(--r-s); color:var(--text-2); }
  .iconbtn:hover { background:var(--card-hover); color:var(--text); }

  /* ---- title bar ---- */
  .titlebar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px;
              height:52px; padding:0 20px; background:var(--bg-2); border-bottom:1px solid var(--stroke); }
  .titlebar .logo { width:28px; height:28px; border-radius:var(--r-s); background:var(--brand);
                    color:var(--on-brand); display:flex; align-items:center; justify-content:center; }
  .titlebar .logo .ico { width:18px; height:18px; }
  .titlebar h1 { font-size:15px; font-weight:600; margin:0; }
  .titlebar .sub { font-size:11px; color:var(--text-3); }
  .titlebar .spacer { flex:1; }
  .stat { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-3);
          padding:4px 10px; border:1px solid var(--stroke); border-radius:999px; background:var(--card); }
  .stat b { color:var(--text); font-weight:600; }

  /* ---- pivots (Fluent tabs) ---- */
  .pivots { display:flex; gap:4px; padding:4px 20px 0; background:var(--bg-2); border-bottom:1px solid var(--stroke);
            position:sticky; top:52px; z-index:9; }
  .pivot { position:relative; display:inline-flex; align-items:center; gap:7px; padding:10px 12px 12px;
           font-weight:600; font-size:14px; color:var(--text-3); border-radius:var(--r-s) var(--r-s) 0 0; }
  .pivot:hover { color:var(--text); background:var(--card-hover); }
  .pivot.active { color:var(--text); }
  .pivot.active::after { content:""; position:absolute; left:10px; right:10px; bottom:0; height:3px;
                         border-radius:2px; background:var(--brand); }

  main { padding:18px 20px 70px; max-width:1080px; margin:0 auto; }
  .section-head { display:flex; align-items:center; gap:10px; margin:2px 0 14px; }
  .section-head h2 { margin:0; font-size:19px; font-weight:600; }
  .section-head .spacer { flex:1; }

  /* ---- segmented (view toggle / language) ---- */
  .segmented { display:inline-flex; border:1px solid var(--stroke-2); border-radius:var(--r-s); overflow:hidden; height:32px; }
  .segmented button { display:inline-flex; align-items:center; gap:6px; padding:0 12px; font-weight:600;
                      font-size:12px; color:var(--text-2); }
  .segmented button + button { border-left:1px solid var(--stroke-2); }
  .segmented button:hover { background:var(--card-hover); }
  .segmented button.active { background:var(--brand); color:var(--on-brand); }

  /* ---- selection bar ---- */
  .selbar { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--brand);
            border-left:4px solid var(--brand); border-radius:var(--r-s); padding:8px 8px 8px 14px; margin-bottom:14px;
            box-shadow:var(--shadow-2); }
  .selbar b { font-size:13px; }
  .selbar .spacer { flex:1; }

  /* ---- checkbox (Fluent) ---- */
  .check { width:18px; height:18px; flex:0 0 auto; border-radius:var(--r-s); border:1px solid var(--stroke-2);
           display:flex; align-items:center; justify-content:center; color:transparent; cursor:pointer;
           background:var(--bg-2); transition:.08s; }
  .check:hover { border-color:var(--text-3); }
  .check.on { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  .check .ico { width:12px; height:12px; }

  /* ---- cards / rows ---- */
  .card { background:var(--card); border:1px solid var(--stroke); border-radius:var(--r-m); padding:12px;
          margin-bottom:10px; display:flex; gap:12px; align-items:center; box-shadow:var(--shadow-2); transition:.08s; }
  .card:hover { background:var(--card-hover); }
  .card.sel { border-color:var(--brand); outline:1px solid var(--brand); }
  .card.dim { opacity:.55; }
  .thumb { width:84px; height:60px; border-radius:var(--r-s); object-fit:cover; background:var(--bg-2);
           border:1px solid var(--stroke); flex:0 0 auto; }
  .ava { width:44px; height:44px; border-radius:var(--r-s); object-fit:cover; background:var(--bg-2); flex:0 0 auto; }
  .ava.round { border-radius:50%; }
  .grow { flex:1; min-width:0; }
  .grow.click { cursor:pointer; }
  .title-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .title-row b { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .sub-line { color:var(--text-3); font-size:12px; margin-top:2px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .sub-line .ico { width:13px; height:13px; }
  .meta-stat { display:inline-flex; align-items:center; gap:3px; }
  .badge { font-size:10px; font-weight:700; border-radius:var(--r-s); padding:2px 7px; letter-spacing:.4px;
           border:1px solid transparent; text-transform:uppercase; }
  .badge.official { background:var(--brand); color:var(--on-brand); }
  .badge.hidden { background:var(--card-2); color:var(--text-3); border-color:var(--stroke-2); }
  .badge.banned { background:var(--danger-bg); color:var(--danger-text); border-color:var(--danger); }
  .acts { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; flex:0 0 auto; }

  /* ---- comments: UNIFORM cards so mixed drawing/text rows leave no gaps ---- */
  .cmt-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; }
  .cmt-list { display:flex; flex-direction:column; gap:10px; }
  .cmt-card { background:var(--card); border:1px solid var(--stroke); border-radius:var(--r-m); padding:12px;
              display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-2); transition:.08s; }
  .cmt-card:hover { background:var(--card-hover); }
  .cmt-card.sel { border-color:var(--brand); outline:1px solid var(--brand); }
  .cmt-card.dim { opacity:.55; }
  .cmt-top { display:flex; align-items:center; gap:10px; }
  .cmt-ava { width:32px; height:32px; border-radius:50%; object-fit:cover; background:var(--bg-2); flex:0 0 auto; }
  .cmt-who { flex:1; min-width:0; }
  .cmt-who b { font-size:13px; font-weight:600; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmt-who small { color:var(--text-3); font-size:11px; }
  /* The content zone has the SAME height for every card in a view, whether it
     holds a drawing, a stamp or plain text - so rows always align. */
  .cmt-content { display:flex; align-items:center; justify-content:center; border-radius:var(--r-s);
                 background:var(--bg-2); border:1px solid var(--stroke); overflow:hidden; }
  .cmt-list .cmt-content { height:72px; }
  .cmt-grid .cmt-content { height:120px; }
  .cmt-content img.drawing { width:100%; height:100%; object-fit:contain; background:#fff; cursor:pointer;
                             image-rendering:pixelated; }
  .cmt-content .stamp { font-size:30px; }
  .cmt-content .text { padding:8px 12px; font-size:13px; line-height:1.45; overflow:hidden; text-align:center;
                       display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; word-break:break-word; }
  .cmt-grid .cmt-content .text { -webkit-line-clamp:5; }
  /* Always-present one-line slot for the text that accompanies a drawing, so
     cards with and without it still have identical heights. */
  .cmt-extra { font-size:12px; color:var(--text-2); height:18px; line-height:18px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmt-foot { display:flex; align-items:center; gap:6px; }
  .cmt-foot .where { flex:1; min-width:0; color:var(--text-3); font-size:11px; display:flex; align-items:center; gap:5px;
                     overflow:hidden; }
  .cmt-foot .where span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmt-foot .where b { color:var(--text-2); }

  .empty { color:var(--text-3); padding:56px 20px; text-align:center; }
  .empty .ico { width:44px; height:44px; display:block; margin:0 auto 10px; color:var(--stroke-2); }

  /* ---- login ---- */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login { background:var(--card); border:1px solid var(--stroke); border-radius:var(--r-m); padding:30px;
           max-width:400px; width:100%; box-shadow:var(--shadow-16); }
  .login .logo { width:52px; height:52px; border-radius:var(--r-m); background:var(--brand); color:var(--on-brand);
                 display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .login .logo .ico { width:28px; height:28px; }
  .login h2 { margin:0 0 4px; text-align:center; font-size:20px; font-weight:600; }
  .login p { color:var(--text-3); margin:0 0 20px; text-align:center; font-size:13px; }
  .field input { width:100%; height:32px; padding:0 10px; border-radius:var(--r-s);
                 border:1px solid var(--stroke-2); border-bottom:2px solid var(--stroke-2);
                 background:var(--bg-2); color:var(--text); font:inherit; margin-bottom:14px; }
  .field input:focus { outline:none; border-bottom-color:var(--brand); }
  .login .btn.primary { width:100%; justify-content:center; height:36px; }
  .err { color:var(--danger); font-size:12px; margin:-4px 0 12px; text-align:center; }

  /* ---- dialog ---- */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center;
           justify-content:center; z-index:50; padding:20px; }
  .dialog { background:var(--card); border:1px solid var(--stroke); border-radius:var(--r-m); max-width:700px;
            width:100%; max-height:92vh; overflow:auto; box-shadow:var(--shadow-64); }
  .dialog-head { display:flex; align-items:center; gap:10px; padding:16px 20px 6px; }
  .dialog-head h2 { margin:0; font-size:18px; font-weight:600; flex:1; }
  .dialog-body { padding:6px 20px 20px; }
  .preview { width:100%; max-width:360px; border-radius:var(--r-s); border:1px solid var(--stroke);
             background:var(--bg-2); display:block; margin:6px 0 14px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:7px 16px; margin:6px 0 16px; font-size:13px; }
  .kv .k { color:var(--text-3); }
  .kv .v { font-weight:500; }
  .dialog h3 { font-size:14px; font-weight:600; margin:16px 0 10px; color:var(--text-2);
               text-transform:uppercase; letter-spacing:.4px; }

  /* thread (ascending) */
  .thread { display:flex; flex-direction:column; gap:10px; }
  .bubble { display:flex; gap:9px; }
  .bubble .cmt-ava { width:30px; height:30px; }
  .bubble .body { flex:1; min-width:0; background:var(--bg-2); border:1px solid var(--stroke);
                  border-radius:var(--r-s); padding:9px 12px; }
  .bubble.op .body { border-left:3px solid var(--brand); }
  .bubble .body .who { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .bubble .body .who b { font-size:12px; font-weight:600; }
  .bubble .body .who small { color:var(--text-3); font-size:11px; }
  .bubble .body .txt { font-size:13px; line-height:1.45; word-break:break-word; }
  .bubble .body img.drawing { width:160px; max-width:100%; object-fit:contain; background:#fff;
                              border:1px solid var(--stroke); border-radius:var(--r-s); margin-top:4px;
                              image-rendering:pixelated; cursor:pointer; }
  .bubble .body .stamp { font-size:26px; }
  .bubble .body .delc { float:right; }

  /* settings */
  .settings-card { background:var(--card); border:1px solid var(--stroke); border-radius:var(--r-m);
                   padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-2); }
  .settings-card h3 { margin:0 0 2px; font-size:14px; font-weight:600; }
  .settings-card p { margin:0 0 12px; color:var(--text-3); font-size:12px; }

  @media (max-width:640px){
    .titlebar .stats { display:none; }
    .acts { width:100%; justify-content:flex-start; }
    .card { flex-wrap:wrap; }
  }
</style>
</head>

<div id="app"></div>
<div id="modal"></div>

/* ---------------- state ---------------- */
let data = {users:[],levels:[],comments:[]};
let tab = 'levels';
let commentView = localStorage.getItem('mvdk_admin_cmtview') || 'list';
let serverVersion = '';
const sel = { levels:new Set(), comments:new Set(), users:new Set() };
function clearSel(){ sel.levels.clear(); sel.comments.clear(); sel.users.clear(); }

/* ---------------- load ---------------- */
async function load(){
  const r = await api('/api/admin/overview');
  if(r.status===401){ renderLogin(t('invalidToken')); return; }
  data = await r.json();
  try { const v = await (await api('/api/info')).json(); serverVersion = v.version||''; } catch(e){}
  render();
}

/* ---------------- login ---------------- */
function renderLogin(err){
  $('#modal').innerHTML=''; clearSel();
  $('#app').innerHTML = `<div class="login-wrap"><div class="login">
    <div class="logo">${ic('game')}</div>
    <h2>${t('login')}</h2><p>${t('loginHint')}</p>
    ${err?`<div class="err">${esc(err)}</div>`:''}
    <div class="field"><input type="password" id="tok" placeholder="${t('tokenPh')}" value="${esc(token())}"></div>
    <button class="btn primary" id="go">${t('enter')}</button>
  </div></div>`;
  $('#go').onclick = ()=>{ localStorage.setItem('mvdk_admin_token',$('#tok').value.trim()); load(); };
  $('#tok').onkeydown = e=>{ if(e.key==='Enter') $('#go').click(); };
  $('#tok').focus();
}

/* ---------------- shell ---------------- */
function render(){
  $('#app').innerHTML = `
  <div class="titlebar">
    <div class="logo">${ic('game')}</div>
    <div><h1>MvDK Community</h1><div class="sub">${t('appSub')}</div></div>
    <div class="spacer"></div>
    <div class="stats" style="display:flex;gap:6px">
      <span class="stat">${ic('person')}<b>${data.users.length}</b> ${t('users')}</span>
      <span class="stat">${ic('grid')}<b>${data.levels.length}</b> ${t('levels')}</span>
      <span class="stat">${ic('chat')}<b>${data.comments.length}</b> ${t('comments')}</span>
    </div>
    <button class="iconbtn" id="refresh" title="${t('refresh')}">${ic('refresh')}</button>
  </div>
  <nav class="pivots">
    <button class="pivot" data-tab="levels">${ic('grid')}${t('navLevels')}</button>
    <button class="pivot" data-tab="comments">${ic('chat')}${t('navComments')}</button>
    <button class="pivot" data-tab="users">${ic('person')}${t('navUsers')}</button>
    <button class="pivot" data-tab="settings">${ic('gear')}${t('navSettings')}</button>
  </nav>
  <main id="list"></main>`;
  $('#refresh').onclick=load;
  document.querySelectorAll('.pivot').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===tab);
    b.onclick=()=>{ tab=b.dataset.tab; clearSel(); render(); };
  });
  renderList();
}

/* ---------------- selection ---------------- */
function selBar(kind){
  const set = sel[kind]; if(!set.size) return '';
  return `<div class="selbar">
    <b>${set.size} ${t('selected')}</b>
    <div class="spacer"></div>
    <button class="btn subtle sm" onclick="clearSelection('${kind}')">${t('clearSel')}</button>
    <button class="btn danger sm" onclick="deleteSelected('${kind}')">${ic('trash')}${t('deleteSel')}</button>
  </div>`;
}
window.clearSelection = (kind)=>{ sel[kind].clear(); renderList(); };
window.toggleSel = (kind,id)=>{ const s=sel[kind]; s.has(id)?s.delete(id):s.add(id); renderList(); };
window.toggleAll = (kind)=>{
  const ids = (kind==='levels'?data.levels: kind==='comments'?data.comments: data.users).map(x=>x.id);
  const s=sel[kind]; if(ids.every(i=>s.has(i))) ids.forEach(i=>s.delete(i)); else ids.forEach(i=>s.add(i));
  renderList();
};
window.deleteSelected = async (kind)=>{
  const ids=[...sel[kind]]; if(!ids.length) return;
  const msg = kind==='levels'?t('confirmLevels',ids.length): kind==='comments'?t('confirmComments',ids.length): t('confirmUsers',ids.length);
  if(!confirm(msg)) return;
  await api(`/api/admin/${kind}/delete`,{method:'POST',body:JSON.stringify({ids})});
  sel[kind].clear(); await load();
};
function check(kind,id){ const on=sel[kind].has(id);
  return `<div class="check ${on?'on':''}" onclick="event.stopPropagation();toggleSel('${kind}','${id}')">${on?ic('check'):''}</div>`; }

/* ---------------- lists ---------------- */
function renderList(){
  const el=$('#list'); let h='';
  if(tab==='settings'){ el.innerHTML=renderSettings(); bindSettings(); return; }

  const arr = tab==='levels'?data.levels: tab==='comments'?data.comments: data.users;
  const noneKey = tab==='levels'?'noLevels': tab==='comments'?'noComments':'noUsers';
  const title = tab==='levels'?t('navLevels'): tab==='comments'?t('navComments'):t('navUsers');

  h += `<div class="section-head"><h2>${title}</h2><div class="spacer"></div>`;
  if(tab==='comments'){
    h += `<div class="segmented">
      <button class="${commentView==='list'?'active':''}" onclick="setCmtView('list')">${ic('list')}${t('viewList')}</button>
      <button class="${commentView==='grid'?'active':''}" onclick="setCmtView('grid')">${ic('grid')}${t('viewGrid')}</button></div>`;
  }
  if(arr.length) h += `<button class="btn subtle sm" onclick="toggleAll('${tab}')">${ic('selectall')}${t('selectAll')}</button>`;
  h += `</div>`;
  h += selBar(tab);

  if(!arr.length){ el.innerHTML = h+`<div class="empty">${ic(tab==='levels'?'grid':tab==='comments'?'chat':'person')}${t(noneKey)}</div>`; return; }

  if(tab==='levels') h += data.levels.map(levelCard).join('');
  else if(tab==='comments') h += `<div class="${commentView==='grid'?'cmt-grid':'cmt-list'}">`+data.comments.map(commentCard).join('')+`</div>`;
  else h += data.users.map(userCard).join('');
  el.innerHTML=h;
}

function levelCard(l){
  const s=sel.levels.has(l.id);
  return `<div class="card ${s?'sel':''} ${l.hidden?'dim':''}">
    ${check('levels',l.id)}
    <img class="thumb" src="${l.thumbnail||''}" onerror="this.style.visibility='hidden'">
    <div class="grow click" onclick="openLevel('${l.id}')">
      <div class="title-row"><b>${esc(l.title)}</b>
        ${l.official?`<span class="badge official">${t('official')}</span>`:''}
        ${l.hidden?`<span class="badge hidden">${t('hidden')}</span>`:''}</div>
      <div class="sub-line">
        <span>${t('by')} ${esc(l.authorName)}</span>
        <span class="meta-stat">👍 ${l.stars} ${t('likes')}</span>
        <span class="meta-stat">⭐ ${l.tips||0} ${t('stars')}</span>
        <span class="meta-stat">${ic('download')}${l.downloads||0}</span>
        <span class="meta-stat">${ic('chat')}${l.comments||0}</span>
      </div>
      ${l.params?`<div class="sub-line"><span>${l.params.multiDoor?t('multiDoor'):t('oneDoor',l.params.doors||1)}</span><span>${l.params.width}×${l.params.height}</span><span>${esc(l.params.theme||'')}</span></div>`:''}
      ${(l.body||l.memo)?`<div class="sub-line"><span class="meta-stat">${ic('chat')} ${l.memo?`🎨 ${t('drawing')}`:esc(l.body).slice(0,80)}</span></div>`:''}
    </div>
    <div class="acts">
      <button class="btn sm ${l.official?'on':''}" onclick="setOfficial('${l.id}',${!l.official})">${ic('star')}${l.official?t('unofficial'):t('makeOfficial')}</button>
      <button class="btn sm" title="${t('download')}" onclick="dlLevel('${l.id}')">${ic('download')}</button>
      <button class="btn sm" title="${l.hidden?t('unhide'):t('hide')}" onclick="hideLevel('${l.id}',${!l.hidden})">${ic(l.hidden?'eye':'eyeoff')}</button>
      <button class="btn danger sm" title="${t('del')}" onclick="delLevel('${l.id}')">${ic('trash')}</button>
    </div></div>`;
}

function commentCard(c){
  const s=sel.comments.has(c.id);
  const ava = c.userAvatar?`<img class="cmt-ava" src="${c.userAvatar}" onerror="this.style.visibility='hidden'">`:`<div class="cmt-ava"></div>`;
  let content;
  if(c.memo) content = `<img class="drawing" src="${c.memo}" onclick="viewMemo('${c.memo}')" onerror="this.style.visibility='hidden'">`;
  else if(c.stamp) content = `<div class="stamp">🔖</div>`;
  else content = `<div class="text">${c.text?esc(c.text):`<i style="color:var(--text-3)">${t('noText')}</i>`}</div>`;
  return `<div class="cmt-card ${s?'sel':''} ${c.hidden?'dim':''}">
    <div class="cmt-top">
      ${check('comments',c.id)}
      ${ava}
      <div class="cmt-who"><b>${esc(c.userName)}</b><small>${dt(c.createdAt)}</small></div>
      ${c.hidden?`<span class="badge hidden">${t('hidden')}</span>`:''}
    </div>
    <div class="cmt-content">${content}</div>
    <div class="cmt-extra">${(c.memo||c.stamp)&&c.text?esc(c.text):''}</div>
    <div class="cmt-foot">
      <div class="where">${ic('grid')}<span><b>${esc(c.levelTitle||c.levelId)}</b></span></div>
      <button class="btn sm" title="${c.hidden?t('unhide'):t('hide')}" onclick="hideComment('${c.id}',${!c.hidden})">${ic(c.hidden?'eye':'eyeoff')}</button>
      <button class="btn danger sm" title="${t('del')}" onclick="delComment('${c.id}')">${ic('trash')}</button>
    </div></div>`;
}

function userCard(u){
  const s=sel.users.has(u.id);
  return `<div class="card ${s?'sel':''} ${u.banned?'dim':''}">
    ${check('users',u.id)}
    <img class="ava round" src="${u.avatar||''}" onerror="this.style.visibility='hidden'">
    <div class="grow">
      <div class="title-row"><b>${esc(u.name)}</b>${u.banned?`<span class="badge banned">${t('banned')}</span>`:''}</div>
      <div class="sub-line"><span>${t('id')} ${esc(u.id)}</span><span>${t('joined')} ${dt(u.createdAt)}</span></div>
    </div>
    <div class="acts">
      <button class="btn sm" onclick="banUser('${u.id}',${!u.banned})">${ic(u.banned?'unlock':'ban')}${u.banned?t('unban'):t('ban')}</button>
      <button class="btn danger sm" title="${t('del')}" onclick="delUser('${u.id}')">${ic('trash')}</button>
    </div></div>`;
}

/* ---------------- settings ---------------- */
function renderSettings(){
  return `<div class="section-head"><h2>${t('settings')}</h2></div>
  <div class="settings-card">
    <h3>${t('language')}</h3><p>${t('langDesc')}</p>
    <div class="segmented" id="langseg">
      <button data-lang="es" class="${lang==='es'?'active':''}">${ic('globe')}${t('spanish')}</button>
      <button data-lang="en" class="${lang==='en'?'active':''}">${ic('globe')}${t('english')}</button>
    </div>
  </div>
  <div class="settings-card">
    <h3>${t('session')}</h3><p>${t('sessionDesc')}</p>
    <button class="btn danger" id="logout">${ic('logout')}${t('logout')}</button>
  </div>
  <div class="settings-card">
    <h3>${t('about')}</h3>
    <div class="kv" style="margin:8px 0 0"><span class="k">${t('serverVersion')}</span><span class="v">${esc(serverVersion||'—')}</span></div>
  </div>`;
}
function bindSettings(){
  document.querySelectorAll('#langseg button').forEach(b=>b.onclick=()=>{
    lang=b.dataset.lang; localStorage.setItem('mvdk_admin_lang',lang);
    document.documentElement.lang=lang; render();
  });
  $('#logout').onclick=()=>{ localStorage.removeItem('mvdk_admin_token'); renderLogin(); };
}

/* ---------------- modal / detail ---------------- */
function closeModal(){ $('#modal').innerHTML=''; }
window.setCmtView=(v)=>{ commentView=v; localStorage.setItem('mvdk_admin_cmtview',v); renderList(); };
window.viewMemo=(src)=>{ $('#modal').innerHTML=`<div class="scrim" onclick="closeModal()"><div class="dialog" style="max-width:440px" onclick="event.stopPropagation()">
  <div class="dialog-head"><h2>${t('drawing')}</h2><button class="iconbtn" onclick="closeModal()">${ic('close')}</button></div>
  <div class="dialog-body"><img class="preview" style="image-rendering:pixelated;max-width:100%" src="${src}"></div></div></div>`; };

window.openLevel = async (id)=>{
  const r=await api('/api/admin/levels/'+id); if(!r.ok){ return; }
  const l=await r.json(); const p=l.params||{};
  const thread=(l.comments||[]).map(c=>{
    const ava=c.userAvatar?`<img class="cmt-ava" src="${c.userAvatar}" onerror="this.style.visibility='hidden'">`:`<div class="cmt-ava"></div>`;
    let body;
    if(c.memo) body=`<img class="drawing" src="${c.memo}" onclick="viewMemo('${c.memo}')">`;
    else if(c.stamp) body=`<span class="stamp">🔖</span>`;
    else body=`<div class="txt">${esc(c.text||'')}</div>`;
    const extra=(c.memo||c.stamp)&&c.text?`<div class="txt" style="margin-top:4px">${esc(c.text)}</div>`:'';
    return `<div class="bubble">${ava}<div class="body">
      <button class="btn danger sm delc" onclick="delCommentReload('${c.id}','${id}')">${ic('trash')}</button>
      <div class="who"><b>${esc(c.userName)}</b><small>${dt(c.createdAt)}</small>${c.hidden?`<span class="badge hidden">${t('hidden')}</span>`:''}</div>
      ${body}${extra}</div></div>`;
  }).join('') || `<p style="color:var(--text-3)">${t('noCommentsLevel')}</p>`;
  const opAva=l.authorAvatar?`<img class="cmt-ava" src="${l.authorAvatar}" onerror="this.style.visibility='hidden'">`:`<div class="cmt-ava"></div>`;
  let opBody;
  if(l.memo) opBody=`<img class="drawing" src="${l.memo}" onclick="viewMemo('${l.memo}')">`;
  else opBody=`<div class="txt">${l.body?esc(l.body):`<i style="color:var(--text-3)">${t('noInitialComment')}</i>`}</div>`;
  const opExtra=l.memo&&l.body?`<div class="txt" style="margin-top:4px">${esc(l.body)}</div>`:'';
  const opBubble=`<div class="bubble op">${opAva}<div class="body">
    <div class="who"><b>${esc(l.authorName)}</b><span class="badge official">${t('initialComment')}</span><small>${dt(l.createdAt)}</small></div>
    ${opBody}${opExtra}</div></div>`;
  $('#modal').innerHTML=`<div class="scrim" onclick="closeModal()"><div class="dialog" onclick="event.stopPropagation()">
    <div class="dialog-head"><h2>${esc(l.title)}</h2>${l.official?`<span class="badge official">${t('official')}</span>`:''}<button class="iconbtn" onclick="closeModal()">${ic('close')}</button></div>
    <div class="dialog-body">
      <div class="sub-line" style="margin-bottom:8px">${t('by')} ${esc(l.authorName)}</div>
      ${l.thumbnail?`<img class="preview" src="${l.thumbnail}">`:''}
      <div class="kv">
        <span class="k">${t('community')}</span><span class="v">${l.official?t('nintendo'):t('usersCommunity')}</span>
        <span class="k">${t('doors')}</span><span class="v">${p.multiDoor?t('multiDoor'):t('oneDoor',p.doors||1)}</span>
        <span class="k">${t('goalScore')}</span><span class="v">${p.goalScore!=null?p.goalScore:'—'}</span>
        <span class="k">${t('dimensions')}</span><span class="v">${p.width?`${p.width} × ${p.height}`:'—'}</span>
        <span class="k">${t('theme')}</span><span class="v">${esc(p.theme||'—')}</span>
        <span class="k">👍 ${t('likes')}</span><span class="v">${l.stars}</span>
        <span class="k">⭐ ${t('stars')}</span><span class="v">${l.tips||0}</span>
        <span class="k">${t('downloads')}</span><span class="v">${l.downloads||0}</span>
        <span class="k">${t('dataIds')}</span><span class="v">${esc(l.primaryID||'—')}${l.secondaryID?(' / '+esc(l.secondaryID)):''}</span>
        <span class="k">${t('published')}</span><span class="v">${dt(l.createdAt)}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
        <button class="btn ${l.official?'on':''}" onclick="setOfficial('${l.id}',${!l.official})">${ic('star')}${l.official?t('unofficial'):t('makeOfficial')}</button>
        <button class="btn" onclick="dlLevel('${l.id}')">${ic('download')}${t('download')}</button>
        <button class="btn danger" onclick="delLevel('${l.id}')">${ic('trash')}${t('del')}</button>
      </div>
      <h3>${t('commentsThread')} (${(l.comments||[]).length})</h3>
      <div class="thread">${opBubble}${thread}</div>
    </div></div></div>`;
};
window.delCommentReload = async (cid,lid)=>{ if(!confirm(t('confirmComment'))) return; await api(`/api/admin/comments/${cid}`,{method:'DELETE'}); await load(); openLevel(lid); };

window.dlLevel = async (id)=>{
  const r=await api('/api/admin/levels/'+id+'/download'); if(!r.ok) return;
  const blob=await r.blob(); const u=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=u; a.download=id+'.mvdklevel.json'; a.click(); URL.revokeObjectURL(u);
};
async function act(p,opts){ await api(p,opts); closeModal(); await load(); }
window.setOfficial=(id,v)=>act(`/api/admin/levels/${id}/official`,{method:'POST',body:JSON.stringify({official:v})});
window.hideLevel=(id,h)=>act(`/api/admin/levels/${id}/hide`,{method:'POST',body:JSON.stringify({hidden:h})});
window.delLevel=(id)=>{ if(confirm(t('confirmLevel'))) act(`/api/admin/levels/${id}`,{method:'DELETE'}); };
window.hideComment=(id,h)=>act(`/api/admin/comments/${id}/hide`,{method:'POST',body:JSON.stringify({hidden:h})});
window.delComment=(id)=>{ if(confirm(t('confirmComment'))) act(`/api/admin/comments/${id}`,{method:'DELETE'}); };
window.banUser=(id,b)=>act(`/api/admin/users/${id}/ban`,{method:'POST',body:JSON.stringify({banned:b})});
window.delUser=(id)=>{ if(confirm(t('confirmUser'))) act(`/api/admin/users/${id}`,{method:'DELETE'}); };

document.documentElement.lang=lang;
if(token()) load(); else renderLogin();
</script>
</body>
</html>
