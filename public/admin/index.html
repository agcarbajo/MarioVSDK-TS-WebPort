<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MvDK Community — Admin</title>
<style>
  /* ---- Material 3 Expressive tokens (gold tonal, dark default) ---- */
  :root {
    --primary:#ffd24a; --on-primary:#3e2e00; --primary-container:#5a4500; --on-primary-container:#ffe08a;
    --secondary-container:#4b4626; --on-secondary-container:#ece2bd;
    --tertiary-container:#1f4d44; --on-tertiary-container:#aeede0;
    --error:#ffb4ab; --error-container:#5d1620; --on-error-container:#ffdad6;
    --surface:#14130c;
    --surface-c-lowest:#0e0d07; --surface-c-low:#1c1b13; --surface-c:#201f17;
    --surface-c-high:#2b2a21; --surface-c-highest:#36352b;
    --on-surface:#e8e2d4; --on-surface-var:#cdc6b3; --outline:#979080; --outline-variant:#4b4839;
    --shadow:rgba(0,0,0,.45);
    --r-s:12px; --r-m:16px; --r-l:24px; --r-xl:28px; --r-full:999px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --primary:#785a00; --on-primary:#ffffff; --primary-container:#ffe08a; --on-primary-container:#251a00;
      --secondary-container:#f1e7c6; --on-secondary-container:#211b04;
      --tertiary-container:#bbece0; --on-tertiary-container:#00201a;
      --error:#ba1a1a; --error-container:#ffdad6; --on-error-container:#410002;
      --surface:#fdf9ee;
      --surface-c-lowest:#ffffff; --surface-c-low:#f7f2e6; --surface-c:#f2ece0;
      --surface-c-high:#ece6da; --surface-c-highest:#e6e0d4;
      --on-surface:#1c1b14; --on-surface-var:#4b4839; --outline:#7c7768; --outline-variant:#cdc6b3;
      --shadow:rgba(0,0,0,.18);
    }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--surface); color:var(--on-surface); -webkit-font-smoothing:antialiased;
         font:15px/1.5 Roboto,"Segoe UI",system-ui,-apple-system,sans-serif; }
  .ico { width:20px; height:20px; flex:0 0 auto; vertical-align:-4px; }

  /* ---- buttons (M3) ---- */
  button { font:inherit; color:inherit; cursor:pointer; background:none; border:none; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 20px;
         border-radius:var(--r-full); font-weight:600; font-size:14px; transition:.15s; white-space:nowrap; }
  .btn .ico { width:18px; height:18px; }
  .btn.filled { background:var(--primary); color:var(--on-primary); }
  .btn.filled:hover { box-shadow:0 2px 6px var(--shadow); filter:brightness(1.05); }
  .btn.tonal { background:var(--secondary-container); color:var(--on-secondary-container); }
  .btn.tonal:hover { filter:brightness(1.12); }
  .btn.tonal.on { background:var(--primary); color:var(--on-primary); }
  .btn.outlined { box-shadow:inset 0 0 0 1px var(--outline); color:var(--primary); }
  .btn.outlined:hover { background:color-mix(in srgb,var(--primary) 8%,transparent); }
  .btn.text { padding:0 14px; color:var(--primary); }
  .btn.text:hover { background:color-mix(in srgb,var(--primary) 8%,transparent); }
  .btn.danger { background:var(--error-container); color:var(--on-error-container); }
  .btn.danger:hover { filter:brightness(1.15); }
  .btn.sm { height:32px; padding:0 14px; font-size:13px; }
  .btn.sm .ico { width:16px; height:16px; }
  .iconbtn { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px;
             border-radius:var(--r-full); color:var(--on-surface-var); transition:.15s; }
  .iconbtn:hover { background:color-mix(in srgb,var(--on-surface) 8%,transparent); color:var(--on-surface); }

  /* ---- app layout: navigation rail (desktop) / bottom bar (mobile) ---- */
  .shell { display:flex; min-height:100vh; }
  .rail { width:88px; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px;
          padding:16px 0 20px; background:var(--surface-c-low); position:sticky; top:0; height:100vh; }
  .rail .logo { width:48px; height:48px; border-radius:var(--r-m); background:var(--primary-container);
                color:var(--on-primary-container); display:flex; align-items:center; justify-content:center;
                margin-bottom:14px; }
  .rail .logo .ico { width:26px; height:26px; }
  .dest { display:flex; flex-direction:column; align-items:center; gap:4px; width:80px; padding:6px 0;
          color:var(--on-surface-var); font-size:12px; font-weight:600; border-radius:var(--r-m); }
  .dest .pill { display:flex; align-items:center; justify-content:center; width:56px; height:32px;
                border-radius:var(--r-full); transition:.2s; }
  .dest:hover .pill { background:color-mix(in srgb,var(--on-surface) 8%,transparent); }
  .dest.active { color:var(--on-surface); }
  .dest.active .pill { background:var(--secondary-container); color:var(--on-secondary-container); }
  .rail .spacer { flex:1; }
  .content { flex:1; min-width:0; padding:28px 32px 110px; max-width:1060px; }

  /* ---- expressive headline ---- */
  .headline { margin:0 0 6px; font-size:clamp(28px,4vw,40px); font-weight:800; letter-spacing:-.5px; line-height:1.1; }
  .headsub { color:var(--on-surface-var); font-size:14px; margin:0 0 18px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 14px; border-radius:var(--r-s);
          background:var(--surface-c-high); color:var(--on-surface-var); font-size:13px; font-weight:600; }
  .chip b { color:var(--on-surface); }
  .toolrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 16px; }
  .toolrow .spacer { flex:1; }

  /* ---- extended FAB (refresh) ---- */
  .fab { position:fixed; right:24px; bottom:24px; z-index:20; display:inline-flex; align-items:center; gap:10px;
         height:56px; padding:0 22px; border-radius:var(--r-m); background:var(--primary-container);
         color:var(--on-primary-container); font-weight:700; font-size:15px; box-shadow:0 6px 16px var(--shadow); transition:.2s; }
  .fab:hover { filter:brightness(1.08); box-shadow:0 8px 22px var(--shadow); }
  .fab .ico { width:22px; height:22px; }

  /* ---- segmented buttons (M3) ---- */
  .segmented { display:inline-flex; height:40px; border-radius:var(--r-full); box-shadow:inset 0 0 0 1px var(--outline); overflow:hidden; }
  .segmented button { display:inline-flex; align-items:center; gap:6px; padding:0 18px; font-weight:600; font-size:13px;
                      color:var(--on-surface-var); }
  .segmented button + button { box-shadow:inset 1px 0 0 var(--outline); }
  .segmented button.active { background:var(--secondary-container); color:var(--on-secondary-container); }
  .segmented .ico { width:16px; height:16px; }

  /* ---- floating selection toolbar ---- */
  .selbar { position:sticky; top:12px; z-index:15; display:flex; align-items:center; gap:10px;
            background:var(--primary-container); color:var(--on-primary-container);
            border-radius:var(--r-full); padding:8px 10px 8px 20px; margin-bottom:16px; box-shadow:0 4px 14px var(--shadow); }
  .selbar b { font-size:15px; }
  .selbar .spacer { flex:1; }

  /* ---- checkbox ---- */
  .check { width:22px; height:22px; flex:0 0 auto; border-radius:7px; border:2px solid var(--outline);
           display:flex; align-items:center; justify-content:center; color:transparent; cursor:pointer; transition:.12s; }
  .check.on { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
  .check .ico { width:14px; height:14px; }

  /* ---- cards ---- */
  .card { background:var(--surface-c-low); border-radius:var(--r-l); padding:16px; margin-bottom:12px;
          display:flex; gap:14px; align-items:center; transition:.15s; }
  .card:hover { background:var(--surface-c); }
  .card.sel { background:var(--secondary-container); outline:2px solid var(--primary); }
  .card.dim { opacity:.55; }
  .thumb { width:92px; height:66px; border-radius:var(--r-m); object-fit:cover; background:var(--surface-c-high); flex:0 0 auto; }
  .ava { width:52px; height:52px; border-radius:var(--r-m); object-fit:cover; background:var(--surface-c-high); flex:0 0 auto; }
  .ava.round { border-radius:var(--r-full); }
  .grow { flex:1; min-width:0; }
  .grow.click { cursor:pointer; }
  .title-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .title-row b { font-size:16px; font-weight:700; overflow:hidden; text-overflow:ellipsis; }
  .sub-line { color:var(--on-surface-var); font-size:13px; margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .sub-line .ico { width:15px; height:15px; }
  .meta-stat { display:inline-flex; align-items:center; gap:3px; }
  .badge { font-size:11px; font-weight:800; border-radius:var(--r-full); padding:3px 10px; letter-spacing:.3px; }
  .badge.official { background:var(--primary); color:var(--on-primary); }
  .badge.hidden { background:var(--surface-c-highest); color:var(--on-surface-var); }
  .badge.banned { background:var(--error-container); color:var(--on-error-container); }
  .acts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; flex:0 0 auto; }

  /* ---- comments: UNIFORM cards (no gaps in mixed drawing/text rows) ---- */
  .cmt-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .cmt-list { display:flex; flex-direction:column; gap:12px; }
  .cmt-card { background:var(--surface-c-low); border-radius:var(--r-l); padding:14px; display:flex;
              flex-direction:column; gap:10px; transition:.15s; }
  .cmt-card:hover { background:var(--surface-c); }
  .cmt-card.sel { background:var(--secondary-container); outline:2px solid var(--primary); }
  .cmt-card.dim { opacity:.55; }
  .cmt-top { display:flex; align-items:center; gap:10px; }
  .cmt-ava { width:36px; height:36px; border-radius:var(--r-full); object-fit:cover; background:var(--surface-c-high); flex:0 0 auto; }
  .cmt-who { flex:1; min-width:0; }
  .cmt-who b { font-size:14px; font-weight:700; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmt-who small { color:var(--on-surface-var); font-size:12px; }
  /* fixed-height content zone: drawing, stamp and text cards all align */
  .cmt-content { display:flex; align-items:center; justify-content:center; border-radius:var(--r-m);
                 background:var(--surface-c-high); overflow:hidden; }
  .cmt-list .cmt-content { height:76px; }
  .cmt-grid .cmt-content { height:124px; }
  .cmt-content img.drawing { width:100%; height:100%; object-fit:contain; background:#fff; cursor:pointer;
                             image-rendering:pixelated; }
  .cmt-content .stamp { font-size:32px; }
  .cmt-content .text { padding:8px 14px; font-size:14px; line-height:1.5; overflow:hidden; text-align:center;
                       display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; word-break:break-word; }
  .cmt-grid .cmt-content .text { -webkit-line-clamp:5; }
  /* always-present one-line slot for text that accompanies a drawing */
  .cmt-extra { font-size:13px; color:var(--on-surface-var); height:19px; line-height:19px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmt-foot { display:flex; align-items:center; gap:6px; }
  .cmt-foot .where { flex:1; min-width:0; color:var(--on-surface-var); font-size:12px; display:flex;
                     align-items:center; gap:5px; overflow:hidden; }
  .cmt-foot .where span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmt-foot .where b { color:var(--on-surface); }

  .empty { color:var(--on-surface-var); padding:64px 20px; text-align:center; }
  .empty .ico { width:52px; height:52px; display:block; margin:0 auto 12px; color:var(--outline-variant); }

  /* ---- login ---- */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login { background:var(--surface-c-low); border-radius:var(--r-xl); padding:34px; max-width:420px; width:100%; }
  .login .logo { width:64px; height:64px; border-radius:var(--r-l); background:var(--primary-container);
                 color:var(--on-primary-container); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  .login .logo .ico { width:34px; height:34px; }
  .login h2 { margin:0 0 6px; text-align:center; font-size:26px; font-weight:800; letter-spacing:-.3px; }
  .login p { color:var(--on-surface-var); margin:0 0 22px; text-align:center; font-size:14px; }
  .field input { width:100%; height:56px; padding:0 18px; border-radius:var(--r-m); border:1px solid var(--outline);
                 background:transparent; color:var(--on-surface); font:inherit; margin-bottom:16px; }
  .field input:focus { outline:none; border:2px solid var(--primary); padding:0 17px; }
  .login .btn.filled { width:100%; height:48px; }
  .err { color:var(--error); font-size:13px; margin:-6px 0 14px; text-align:center; }

  /* ---- dialog ---- */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center;
           justify-content:center; z-index:50; padding:20px; }
  .dialog { background:var(--surface-c-high); border-radius:var(--r-xl); max-width:720px; width:100%;
            max-height:92vh; overflow:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
  .dialog-head { display:flex; align-items:center; gap:12px; padding:22px 24px 8px; }
  .dialog-head h2 { margin:0; font-size:24px; font-weight:800; letter-spacing:-.3px; flex:1; }
  .dialog-body { padding:8px 24px 24px; }
  .preview { width:100%; max-width:380px; border-radius:var(--r-m); background:var(--surface-c); display:block; margin:6px 0 16px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:10px 18px; margin:8px 0 18px; font-size:14px; }
  .kv .k { color:var(--on-surface-var); }
  .kv .v { font-weight:600; }
  .dialog h3 { font-size:17px; font-weight:800; margin:20px 0 12px; letter-spacing:-.2px; }

  /* thread (ascending) */
  .thread { display:flex; flex-direction:column; gap:14px; }
  .bubble { display:flex; gap:10px; }
  .bubble .cmt-ava { width:34px; height:34px; }
  .bubble .body { flex:1; min-width:0; background:var(--surface-c-low); border-radius:6px 18px 18px 18px; padding:11px 14px; }
  .bubble.op .body { background:var(--primary-container); color:var(--on-primary-container); }
  .bubble .body .who { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .bubble .body .who b { font-size:13px; font-weight:700; }
  .bubble .body .who small { color:var(--on-surface-var); font-size:11px; }
  .bubble.op .body .who small { color:inherit; opacity:.7; }
  .bubble .body .txt { font-size:14px; line-height:1.5; word-break:break-word; }
  .bubble .body img.drawing { width:170px; max-width:100%; object-fit:contain; background:#fff;
                              border-radius:var(--r-s); margin-top:4px; image-rendering:pixelated; cursor:pointer; }
  .bubble .body .stamp { font-size:28px; }
  .bubble .body .delc { float:right; }

  /* settings */
  .settings-card { background:var(--surface-c-low); border-radius:var(--r-l); padding:20px 22px; margin-bottom:14px; }
  .settings-card h3 { margin:0 0 4px; font-size:17px; font-weight:800; letter-spacing:-.2px; }
  .settings-card p { margin:0 0 14px; color:var(--on-surface-var); font-size:13px; }

  /* ---- mobile: bottom navigation bar ---- */
  @media (max-width:720px){
    .shell { flex-direction:column; }
    .rail { flex-direction:row; width:100%; height:auto; position:fixed; top:auto; bottom:0; left:0; z-index:30;
            padding:8px 4px calc(8px + env(safe-area-inset-bottom)); justify-content:space-around;
            background:var(--surface-c); box-shadow:0 -2px 12px var(--shadow); }
    .rail .logo, .rail .spacer { display:none; }
    .dest { width:auto; flex:1; }
    .content { padding:22px 16px 150px; }
    .fab { bottom:96px; }
    .acts { width:100%; justify-content:flex-start; }
    .card { flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>

const api = (p,opts={}) => fetch(p, Object.assign({headers:{'X-Admin-Token':token(),'Content-Type':'application/json'}}, opts));
const token = () => localStorage.getItem('mvdk_admin_token') || '';

/* ---------------- state ---------------- */
let data = {users:[],levels:[],comments:[]};
let tab = 'levels';
let commentView = localStorage.getItem('mvdk_admin_cmtview') || 'list';
let serverVersion = '';
const sel = { levels:new Set(), comments:new Set(), users:new Set() };
function clearSel(){ sel.levels.clear(); sel.comments.clear(); sel.users.clear(); }

/* ---------------- load ---------------- */
async function load(){
  const r = await api('/api/admin/overview');
  if(r.status===401){ renderLogin(t('invalidToken')); return; }
  data = await r.json();
  try { const v = await (await api('/api/info')).json(); serverVersion = v.version||''; } catch(e){}
  render();
}

/* ---------------- login ---------------- */
function renderLogin(err){
  $('#modal').innerHTML=''; clearSel();
  $('#app').innerHTML = `<div class="login-wrap"><div class="login">
    <div class="logo">${ic('game')}</div>
    <h2>${t('login')}</h2><p>${t('loginHint')}</p>
    ${err?`<div class="err">${esc(err)}</div>`:''}
    <div class="field"><input type="password" id="tok" placeholder="${t('tokenPh')}" value="${esc(token())}"></div>
    <button class="btn filled" id="go">${t('enter')}</button>
  </div></div>`;
  $('#go').onclick = ()=>{ localStorage.setItem('mvdk_admin_token',$('#tok').value.trim()); load(); };
  $('#tok').onkeydown = e=>{ if(e.key==='Enter') $('#go').click(); };
  $('#tok').focus();
}

/* ---------------- shell: navigation rail + content ---------------- */
function render(){
  const dests = [
    ['levels','grid',t('navLevels')],
    ['comments','chat',t('navComments')],
    ['users','person',t('navUsers')],
    ['settings','gear',t('navSettings')],
  ];
  $('#app').innerHTML = `
  <div class="shell">
    <nav class="rail">
      <div class="logo">${ic('game')}</div>
      ${dests.map(d=>`<button class="dest ${tab===d[0]?'active':''}" data-tab="${d[0]}">
        <span class="pill">${ic(d[1])}</span><span>${d[2]}</span></button>`).join('')}
      <div class="spacer"></div>
    </nav>
    <div class="content" id="content"></div>
  </div>
  <button class="fab" id="refresh">${ic('refresh')}${t('refresh')}</button>`;
  $('#refresh').onclick=load;
  document.querySelectorAll('.dest').forEach(b=>{
    b.onclick=()=>{ tab=b.dataset.tab; clearSel(); render(); };
  });
  renderList();
}

/* ---------------- selection ---------------- */
function selBar(kind){
  const set = sel[kind]; if(!set.size) return '';
  return `<div class="selbar">
    <b>${set.size} ${t('selected')}</b>
    <div class="spacer"></div>
    <button class="btn text" style="color:inherit" onclick="clearSelection('${kind}')">${t('clearSel')}</button>
    <button class="btn danger" onclick="deleteSelected('${kind}')">${ic('trash')}${t('deleteSel')}</button>
  </div>`;
}
window.clearSelection = (kind)=>{ sel[kind].clear(); renderList(); };
window.toggleSel = (kind,id)=>{ const s=sel[kind]; s.has(id)?s.delete(id):s.add(id); renderList(); };
window.toggleAll = (kind)=>{
  const ids = (kind==='levels'?data.levels: kind==='comments'?data.comments: data.users).map(x=>x.id);
  const s=sel[kind]; if(ids.every(i=>s.has(i))) ids.forEach(i=>s.delete(i)); else ids.forEach(i=>s.add(i));
  renderList();
};
window.deleteSelected = async (kind)=>{
  const ids=[...sel[kind]]; if(!ids.length) return;
  const msg = kind==='levels'?t('confirmLevels',ids.length): kind==='comments'?t('confirmComments',ids.length): t('confirmUsers',ids.length);
  if(!confirm(msg)) return;
  await api(`/api/admin/${kind}/delete`,{method:'POST',body:JSON.stringify({ids})});
  sel[kind].clear(); await load();
};
function check(kind,id){ const on=sel[kind].has(id);
  return `<div class="check ${on?'on':''}" onclick="event.stopPropagation();toggleSel('${kind}','${id}')">${on?ic('check'):''}</div>`; }

/* ---------------- lists ---------------- */
function renderList(){
  const el=$('#content'); let h='';
  if(tab==='settings'){ el.innerHTML=renderSettings(); bindSettings(); return; }

  const arr = tab==='levels'?data.levels: tab==='comments'?data.comments: data.users;
  const noneKey = tab==='levels'?'noLevels': tab==='comments'?'noComments':'noUsers';
  const title = tab==='levels'?t('navLevels'): tab==='comments'?t('navComments'):t('navUsers');

  h += `<h1 class="headline">${title}</h1>
  <div class="headsub">
    <span class="chip">${ic('person')}<b>${data.users.length}</b> ${t('users')}</span>
    <span class="chip">${ic('grid')}<b>${data.levels.length}</b> ${t('levels')}</span>
    <span class="chip">${ic('chat')}<b>${data.comments.length}</b> ${t('comments')}</span>
  </div>
  <div class="toolrow">`;
  if(tab==='comments'){
    h += `<div class="segmented">
      <button class="${commentView==='list'?'active':''}" onclick="setCmtView('list')">${commentView==='list'?ic('check'):ic('list')}${t('viewList')}</button>
      <button class="${commentView==='grid'?'active':''}" onclick="setCmtView('grid')">${commentView==='grid'?ic('check'):ic('grid')}${t('viewGrid')}</button></div>`;
  }
  h += `<div class="spacer"></div>`;
  if(arr.length) h += `<button class="btn text" onclick="toggleAll('${tab}')">${ic('selectall')}${t('selectAll')}</button>`;
  h += `</div>`;
  h += selBar(tab);

  if(!arr.length){ el.innerHTML = h+`<div class="empty">${ic(tab==='levels'?'grid':tab==='comments'?'chat':'person')}${t(noneKey)}</div>`; return; }

  if(tab==='levels') h += data.levels.map(levelCard).join('');
  else if(tab==='comments') h += `<div class="${commentView==='grid'?'cmt-grid':'cmt-list'}">`+data.comments.map(commentCard).join('')+`</div>`;
  else h += data.users.map(userCard).join('');
  el.innerHTML=h;
}

function levelCard(l){
  const s=sel.levels.has(l.id);
  return `<div class="card ${s?'sel':''} ${l.hidden?'dim':''}">
    ${check('levels',l.id)}
    <img class="thumb" src="${l.thumbnail||''}" onerror="this.style.visibility='hidden'">
    <div class="grow click" onclick="openLevel('${l.id}')">
      <div class="title-row"><b>${esc(l.title)}</b>
        ${l.official?`<span class="badge official">${t('official')}</span>`:''}
        ${l.hidden?`<span class="badge hidden">${t('hidden')}</span>`:''}</div>
      <div class="sub-line">
        <span>${t('by')} ${esc(l.authorName)}</span>
        <span class="meta-stat">👍 ${l.stars} ${t('likes')}</span>
        <span class="meta-stat">⭐ ${l.tips||0} ${t('stars')}</span>
        <span class="meta-stat">${ic('download')}${l.downloads||0}</span>
        <span class="meta-stat">${ic('chat')}${l.comments||0}</span>
      </div>
      ${l.params?`<div class="sub-line"><span>${l.params.multiDoor?t('multiDoor'):t('oneDoor',l.params.doors||1)}</span><span>${l.params.width}×${l.params.height}</span><span>${esc(l.params.theme||'')}</span></div>`:''}
      ${(l.body||l.memo)?`<div class="sub-line"><span class="meta-stat">${ic('chat')} ${l.memo?`🎨 ${t('drawing')}`:esc(l.body).slice(0,80)}</span></div>`:''}
    </div>
    <div class="acts">
      <button class="btn tonal sm ${l.official?'on':''}" onclick="setOfficial('${l.id}',${!l.official})">${ic('star')}${l.official?t('unofficial'):t('makeOfficial')}</button>
      <button class="btn tonal sm" title="${t('download')}" onclick="dlLevel('${l.id}')">${ic('download')}</button>
      <button class="btn tonal sm" title="${l.hidden?t('unhide'):t('hide')}" onclick="hideLevel('${l.id}',${!l.hidden})">${ic(l.hidden?'eye':'eyeoff')}</button>
      <button class="btn danger sm" title="${t('del')}" onclick="delLevel('${l.id}')">${ic('trash')}</button>
    </div></div>`;
}

function commentCard(c){
  const s=sel.comments.has(c.id);
  const ava = c.userAvatar?`<img class="cmt-ava" src="${c.userAvatar}" onerror="this.style.visibility='hidden'">`:`<div class="cmt-ava"></div>`;
  let content;
  if(c.memo) content = `<img class="drawing" src="${c.memo}" onclick="viewMemo('${c.memo}')" onerror="this.style.visibility='hidden'">`;
  else if(c.stamp) content = `<div class="stamp">🔖</div>`;
  else content = `<div class="text">${c.text?esc(c.text):`<i style="color:var(--on-surface-var)">${t('noText')}</i>`}</div>`;
  return `<div class="cmt-card ${s?'sel':''} ${c.hidden?'dim':''}">
    <div class="cmt-top">
      ${check('comments',c.id)}
      ${ava}
      <div class="cmt-who"><b>${esc(c.userName)}</b><small>${dt(c.createdAt)}</small></div>
      ${c.hidden?`<span class="badge hidden">${t('hidden')}</span>`:''}
    </div>
    <div class="cmt-content">${content}</div>
    <div class="cmt-extra">${(c.memo||c.stamp)&&c.text?esc(c.text):''}</div>
    <div class="cmt-foot">
      <div class="where">${ic('grid')}<span><b>${esc(c.levelTitle||c.levelId)}</b></span></div>
      <button class="btn tonal sm" title="${c.hidden?t('unhide'):t('hide')}" onclick="hideComment('${c.id}',${!c.hidden})">${ic(c.hidden?'eye':'eyeoff')}</button>
      <button class="btn danger sm" title="${t('del')}" onclick="delComment('${c.id}')">${ic('trash')}</button>
    </div></div>`;
}

function userCard(u){
  const s=sel.users.has(u.id);
  return `<div class="card ${s?'sel':''} ${u.banned?'dim':''}">
    ${check('users',u.id)}
    <img class="ava round" src="${u.avatar||''}" onerror="this.style.visibility='hidden'">
    <div class="grow">
      <div class="title-row"><b>${esc(u.name)}</b>${u.banned?`<span class="badge banned">${t('banned')}</span>`:''}</div>
      <div class="sub-line"><span>${t('id')} ${esc(u.id)}</span><span>${t('joined')} ${dt(u.createdAt)}</span></div>
    </div>
    <div class="acts">
      <button class="btn tonal sm" onclick="banUser('${u.id}',${!u.banned})">${ic(u.banned?'unlock':'ban')}${u.banned?t('unban'):t('ban')}</button>
      <button class="btn danger sm" title="${t('del')}" onclick="delUser('${u.id}')">${ic('trash')}</button>
    </div></div>`;
}

/* ---------------- settings ---------------- */
function renderSettings(){
  return `<h1 class="headline">${t('settings')}</h1><div class="headsub"></div>
  <div class="settings-card">
    <h3>${t('language')}</h3><p>${t('langDesc')}</p>
    <div class="segmented" id="langseg">
      <button data-lang="es" class="${lang==='es'?'active':''}">${lang==='es'?ic('check'):ic('globe')}${t('spanish')}</button>
      <button data-lang="en" class="${lang==='en'?'active':''}">${lang==='en'?ic('check'):ic('globe')}${t('english')}</button>
    </div>
  </div>
  <div class="settings-card">
    <h3>${t('session')}</h3><p>${t('sessionDesc')}</p>
    <button class="btn danger" id="logout">${ic('logout')}${t('logout')}</button>
  </div>
  <div class="settings-card">
    <h3>${t('about')}</h3>
    <div class="kv" style="margin:8px 0 0"><span class="k">${t('serverVersion')}</span><span class="v">${esc(serverVersion||'—')}</span></div>
  </div>`;
}
function bindSettings(){
  document.querySelectorAll('#langseg button').forEach(b=>b.onclick=()=>{
    lang=b.dataset.lang; localStorage.setItem('mvdk_admin_lang',lang);
    document.documentElement.lang=lang; render();
  });
  $('#logout').onclick=()=>{ localStorage.removeItem('mvdk_admin_token'); renderLogin(); };
}

/* ---------------- modal / detail ---------------- */
function closeModal(){ $('#modal').innerHTML=''; }
window.setCmtView=(v)=>{ commentView=v; localStorage.setItem('mvdk_admin_cmtview',v); renderList(); };
window.viewMemo=(src)=>{ $('#modal').innerHTML=`<div class="scrim" onclick="closeModal()"><div class="dialog" style="max-width:460px" onclick="event.stopPropagation()">
  <div class="dialog-head"><h2>${t('drawing')}</h2><button class="iconbtn" onclick="closeModal()">${ic('close')}</button></div>
  <div class="dialog-body"><img class="preview" style="image-rendering:pixelated;max-width:100%" src="${src}"></div></div></div>`; };

window.openLevel = async (id)=>{
  const r=await api('/api/admin/levels/'+id); if(!r.ok){ return; }
  const l=await r.json(); const p=l.params||{};
  const thread=(l.comments||[]).map(c=>{
    const ava=c.userAvatar?`<img class="cmt-ava" src="${c.userAvatar}" onerror="this.style.visibility='hidden'">`:`<div class="cmt-ava"></div>`;
    let body;
    if(c.memo) body=`<img class="drawing" src="${c.memo}" onclick="viewMemo('${c.memo}')" onerror="this.style.visibility='hidden'">`;
    else if(c.stamp) body=`<span class="stamp">🔖</span>`;
    else body=`<div class="txt">${esc(c.text||'')}</div>`;
    const extra=(c.memo||c.stamp)&&c.text?`<div class="txt" style="margin-top:4px">${esc(c.text)}</div>`:'';
    return `<div class="bubble">${ava}<div class="body">
      <button class="btn danger sm delc" onclick="delCommentReload('${c.id}','${id}')">${ic('trash')}</button>
      <div class="who"><b>${esc(c.userName)}</b><small>${dt(c.createdAt)}</small>${c.hidden?`<span class="badge hidden">${t('hidden')}</span>`:''}</div>
      ${body}${extra}</div></div>`;
  }).join('') || `<p style="color:var(--on-surface-var)">${t('noCommentsLevel')}</p>`;
  const opAva=l.authorAvatar?`<img class="cmt-ava" src="${l.authorAvatar}" onerror="this.style.visibility='hidden'">`:`<div class="cmt-ava"></div>`;
  let opBody;
  if(l.memo) opBody=`<img class="drawing" src="${l.memo}" onclick="viewMemo('${l.memo}')" onerror="this.style.visibility='hidden'">`;
  else opBody=`<div class="txt">${l.body?esc(l.body):`<i style="opacity:.7">${t('noInitialComment')}</i>`}</div>`;
  const opExtra=l.memo&&l.body?`<div class="txt" style="margin-top:4px">${esc(l.body)}</div>`:'';
  const opBubble=`<div class="bubble op">${opAva}<div class="body">
    <div class="who"><b>${esc(l.authorName)}</b><span class="badge official">${t('initialComment')}</span><small>${dt(l.createdAt)}</small></div>
    ${opBody}${opExtra}</div></div>`;
  $('#modal').innerHTML=`<div class="scrim" onclick="closeModal()"><div class="dialog" onclick="event.stopPropagation()">
    <div class="dialog-head"><h2>${esc(l.title)}</h2>${l.official?`<span class="badge official">${t('official')}</span>`:''}<button class="iconbtn" onclick="closeModal()">${ic('close')}</button></div>
    <div class="dialog-body">
      <div class="sub-line" style="margin-bottom:8px">${t('by')} ${esc(l.authorName)}</div>
      ${l.thumbnail?`<img class="preview" src="${l.thumbnail}">`:''}
      <div class="kv">
        <span class="k">${t('community')}</span><span class="v">${l.official?t('nintendo'):t('usersCommunity')}</span>
        <span class="k">${t('doors')}</span><span class="v">${p.multiDoor?t('multiDoor'):t('oneDoor',p.doors||1)}</span>
        <span class="k">${t('goalScore')}</span><span class="v">${p.goalScore!=null?p.goalScore:'—'}</span>
        <span class="k">${t('dimensions')}</span><span class="v">${p.width?`${p.width} × ${p.height}`:'—'}</span>
        <span class="k">${t('theme')}</span><span class="v">${esc(p.theme||'—')}</span>
        <span class="k">👍 ${t('likes')}</span><span class="v">${l.stars}</span>
        <span class="k">⭐ ${t('stars')}</span><span class="v">${l.tips||0}</span>
        <span class="k">${t('downloads')}</span><span class="v">${l.downloads||0}</span>
        <span class="k">${t('dataIds')}</span><span class="v">${esc(l.primaryID||'—')}${l.secondaryID?(' / '+esc(l.secondaryID)):''}</span>
        <span class="k">${t('published')}</span><span class="v">${dt(l.createdAt)}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
        <button class="btn tonal ${l.official?'on':''}" onclick="setOfficial('${l.id}',${!l.official})">${ic('star')}${l.official?t('unofficial'):t('makeOfficial')}</button>
        <button class="btn outlined" onclick="dlLevel('${l.id}')">${ic('download')}${t('download')}</button>
        <button class="btn danger" onclick="delLevel('${l.id}')">${ic('trash')}${t('del')}</button>
      </div>
      <h3>${t('commentsThread')} (${(l.comments||[]).length})</h3>
      <div class="thread">${opBubble}${thread}</div>
    </div></div></div>`;
};
window.delCommentReload = async (cid,lid)=>{ if(!confirm(t('confirmComment'))) return; await api(`/api/admin/comments/${cid}`,{method:'DELETE'}); await load(); openLevel(lid); };

window.dlLevel = async (id)=>{
  const r=await api('/api/admin/levels/'+id+'/download'); if(!r.ok) return;
  const blob=await r.blob(); const u=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=u; a.download=id+'.mvdklevel.json'; a.click(); URL.revokeObjectURL(u);
};
async function act(p,opts){ await api(p,opts); closeModal(); await load(); }
window.setOfficial=(id,v)=>act(`/api/admin/levels/${id}/official`,{method:'POST',body:JSON.stringify({official:v})});
window.hideLevel=(id,h)=>act(`/api/admin/levels/${id}/hide`,{method:'POST',body:JSON.stringify({hidden:h})});
window.delLevel=(id)=>{ if(confirm(t('confirmLevel'))) act(`/api/admin/levels/${id}`,{method:'DELETE'}); };
window.hideComment=(id,h)=>act(`/api/admin/comments/${id}/hide`,{method:'POST',body:JSON.stringify({hidden:h})});
window.delComment=(id)=>{ if(confirm(t('confirmComment'))) act(`/api/admin/comments/${id}`,{method:'DELETE'}); };
window.banUser=(id,b)=>act(`/api/admin/users/${id}/ban`,{method:'POST',body:JSON.stringify({banned:b})});
window.delUser=(id)=>{ if(confirm(t('confirmUser'))) act(`/api/admin/users/${id}`,{method:'DELETE'}); };

document.documentElement.lang=lang;
if(token()) load(); else renderLogin();
</script>
</body>
</html>
